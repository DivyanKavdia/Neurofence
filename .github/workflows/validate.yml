name: Validate console and infrastructure
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run litellm:source
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check committed static build
        run: git diff --exit-code -- index.html assets/console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-results
          path: test-results/
  litellm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start pinned LiteLLM fixture
        env:
          LITELLM_MASTER_KEY: sk-neuralfence-ci-fixture-only-key
        run: docker compose -f integrations/litellm/compose.yaml up --wait --wait-timeout 120 -d
      - name: Exercise the complete model path and mobile playground
        env:
          NF_TEST_LITELLM_URL: http://127.0.0.1:4000
          NF_TEST_BROWSER: '1'
        run: npm run test:litellm
      - name: Fixture service diagnostics
        if: failure()
        run: docker compose -f integrations/litellm/compose.yaml logs --no-color
        env:
          LITELLM_MASTER_KEY: sk-neuralfence-ci-fixture-only-key
      - name: Stop fixture
        if: always()
        run: docker compose -f integrations/litellm/compose.yaml down
        env:
          LITELLM_MASTER_KEY: sk-neuralfence-ci-fixture-only-key
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [aws, platform]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - if: matrix.root == 'aws'
        run: terraform test -no-color
