name: neuralfence-dependencies
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neuralfence
      POSTGRES_USER: neuralfence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuralfence -d neuralfence']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: valkey/valkey:8.0
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'exec valkey-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis:/data]
    healthcheck:
      test: ['CMD-SHELL', 'VALKEYCLI_AUTH="$$REDIS_PASSWORD" valkey-cli ping']
      interval: 10s
      timeout: 5s
      retries: 10
  kafka:
    image: apache/kafka:3.9.1
    ports: ['127.0.0.1:9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka:/var/lib/kafka/data]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: neuralfence
      CLICKHOUSE_USER: neuralfence
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ['127.0.0.1:8123:8123']
    volumes: [clickhouse:/var/lib/clickhouse]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: neuralfence-local
      MINIO_ROOT_PASSWORD: ${OBJECT_PASSWORD:?Set OBJECT_PASSWORD in .env}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [objects:/data]
  vault:
    image: hashicorp/vault:1.20
    command: server -dev -dev-listen-address=0.0.0.0:8200
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:?Set VAULT_DEV_TOKEN in .env}
      VAULT_DISABLE_MLOCK: 'true'
    ports: ['127.0.0.1:8200:8200']
  policy:
    image: openpolicyagent/opa:1.8.0-static
    command: ['run', '--server', '--addr=0.0.0.0:8181', '/policies/bootstrap.rego']
    ports: ['127.0.0.1:8181:8181']
    volumes: ['./bootstrap.rego:/policies/bootstrap.rego:ro']
  otel:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ['--config=/etc/otel/config.yaml']
    ports: ['127.0.0.1:4318:4318', '127.0.0.1:8889:8889']
    volumes: ['./otel.yaml:/etc/otel/config.yaml:ro']
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./prometheus.yaml:/etc/prometheus/prometheus.yml:ro', 'metrics:/prometheus']
volumes:
  postgres:
  redis:
  kafka:
  clickhouse:
  objects:
  metrics:
