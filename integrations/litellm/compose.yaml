services:
  litellm:
    image: ${NF_LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.100.1@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf}
    command: ["--config", "/etc/neuralfence/litellm.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set a random server-only key}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      TIKTOKEN_CACHE_DIR: /tmp/tiktoken
      XDG_CACHE_HOME: /tmp/cache
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./fixture.yaml:/etc/neuralfence/litellm.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
