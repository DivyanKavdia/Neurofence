function render(){const a=document.activeElement,focus=a?.id,start=a?.selectionStart,end=a?.selectionEnd;shell();let body='';switch(ui.page){case'overview':body=overview();break;case'inventory':body=inventory();break;case'workforce':body=workforce();break;case'gateway':body=gateway();break;case'guardrails':body=guardrails();break;case'agents':body=agents();break;case'budgets':body=budgets();break;case'incidents':body=incidents();break;case'assurance':body=assurance();break;case'governance':body=governance();break;}document.getElementById('main').innerHTML=body+`<footer class="page-footer"><span>NeuralFence prototype · Synthetic data · No live AI connections</span><span>${storageWorks?'Changes saved in this browser':'Changes kept in this tab'} ${btn('Reset demo','reset-confirm','quiet sm')}</span></footer>`;if(focus){const el=document.getElementById(focus);if(el){el.focus({preventScroll:true});if(typeof start==='number'&&el.setSelectionRange)try{el.setSelectionRange(start,end)}catch(_){}}}}
let modalFocus=null;let modalMeta={};
function modal(title,sub,body,wide=false,drawer=false){modalFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="dialog-backdrop" data-backdrop="true"><section class="dialog ${wide?'wide':''} ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><div><h2 id="dialog-title">${title}</h2><p>${sub}</p></div><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></header><div class="dialog-content">${body}</div></section></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.dialog input:not([disabled]),.dialog select:not([disabled]),.dialog button:not([disabled])')?.focus(),30);}
function closeModal(){const had=document.getElementById('modal-root').hasChildNodes();document.getElementById('modal-root').innerHTML='';document.body.style.overflow='';if(had&&modalFocus?.isConnected)modalFocus.focus({preventScroll:true});}
function formError(message){const f=document.querySelector('.dialog form')||document.querySelector('.dialog-content');if(!f)return;f.querySelector('.form-error')?.remove();const d=document.createElement('div');d.className='form-error';d.setAttribute('role','alert');d.textContent=message;f.prepend(d);}
function actions(primary,action,extra=''){return `<div class="dialog-actions">${btn('Cancel','close-modal')}${btn(primary,action,'primary',extra)}</div>`;}
function formActions(label){return `<div class="dialog-actions">${btn('Cancel','close-modal')}<button type="submit" class="button primary">${label}</button></div>`;}
function traceRows(traces){return traces.map(t=>`<tr><td><button class="link-button mono small" data-action="trace" data-id="${t.id}">${e(t.id.replace('tr-',''))}</button><div class="small muted">${date(t.ts)} · ${time(t.ts)}</div></td><td><strong>${e(projectName(t.project))}</strong><div class="small muted">${t.kind==='tool'?'Tool call':'Model request'} · ${e(t.target)}</div></td><td>${badge(t.decision)}</td><td class="num nowrap">${money(t.cost)}</td><td class="num nowrap">${amount(t.tokens)}</td><td class="right">${btn(icon('chevron'),'trace','quiet sm',`data-id="${t.id}" aria-label="Inspect ${t.id}"`)}</td></tr>`);}
function tracesPanel(traces=displayTraces(),title='Recent activity',limit=7){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2><p class="panel-sub">Every decision linked to its policy, cost and evidence</p></div>${btn('View all '+icon('arrow'),'goto-traces','quiet sm')}</div>${table(['Trace / time','Application / target','Decision','Cost','Tokens',''],traceRows(traces.slice(0,limit)),`<span>${Math.min(traces.length,limit)} of ${traces.length} sample interactions</span><span>Content masked by default</span>`)}</section>`;}
function activityChart(){const count=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return {label:d.toLocaleDateString('en-IN',{weekday:'short'}),start:d.getTime(),all:0,stopped:0}});state.traces.forEach(t=>{const v=count.find(d=>t.ts>=d.start&&t.ts<d.start+86400000);if(v){v.all++;if(t.decision==='DENY'||t.decision==='REQUIRE_APPROVAL')v.stopped++}});const max=Math.max(5,...count.map(d=>d.all)),w=560,h=154,x0=32,bottom=125,step=(w-55)/7;return `<svg class="trend" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily sample requests and blocked or approval-required calls for the last seven days"><title>Daily governed activity over seven days</title>${[0,.5,1].map(v=>`<line x1="${x0}" y1="${bottom-v*102}" x2="${w-8}" y2="${bottom-v*102}" stroke="#edf1f6"/><text x="22" y="${bottom-v*102+3}" text-anchor="end">${Math.round(max*v)}</text>`).join('')}${count.map((d,i)=>{const x=x0+i*step+16,hh=d.all/max*102,sh=d.stopped/max*102;return `<rect x="${x}" y="${bottom-hh}" width="25" height="${hh}" rx="3" fill="${i===6?'#315fe9':'#bcd0fa'}"><title>${d.label}: ${d.all} requests</title></rect><rect x="${x+28}" y="${bottom-sh}" width="7" height="${sh}" rx="2" fill="#dca440"><title>${d.stopped} blocked or pending approval</title></rect><text x="${x+16}" y="146" text-anchor="middle">${d.label}</text>`}).join('')}</svg>`;}
function overview(){const ts=displayTraces(),cost=ts.reduce((a,t)=>a+t.cost,0),interventions=ts.filter(t=>!['ALLOW','MONITOR'].includes(t.decision)).length,assets=state.projects.length+state.agents.length+state.providers.length+state.tools.length;const attention=[...pendingApprovals().slice(0,2).map(a=>({title:'Approve a financial tool call',sub:a.tool+' · '+projectName(a.project),icon:'key',color:'amber',action:'approval',id:a.id})),...openIncidents().slice(0,3).map(i=>({title:i.title,sub:i.severity+' · '+i.owner,icon:'alert',color:i.severity==='Critical'?'':'amber',action:'incident',id:i.id}))];return pageHead('Command center','Security, access and spend across your AI workspace.',select('period',[['1','Last 24 hours'],['7','Last 7 days'],['30','Last 30 days']],ui.days,'class="filter" data-change="period" aria-label="Activity period"')+btn(icon('play')+' Simulate a request','open-playground','primary'))+`<div class="stats">${stat('AI assets',assets,'Applications, agents, providers and tools','layers')}${stat('Governed calls',ts.length,`${ts.filter(t=>t.kind==='model').length} model · ${ts.filter(t=>t.kind==='tool').length} tool requests`,'activity')}${stat('Policy interventions',interventions,'Blocked, redacted or awaiting approval','shield')}${stat('AI spend',money(cost),`${money(spent('org'))} in the demo budget period`,'wallet')}</div><div class="cols">${panel('Governed activity','Daily volume · last seven days',activityChart()+`<div class="row between"><div class="legend"><span><i></i>All requests</span><span><i style="background:#dca440"></i>Blocked / approval</span></div><span class="small muted" style="font-size:10px">${state.traces.length} total sample events</span></div>`,badge('Live preview','blue'))}${panel('Needs attention',`${openIncidents().length} open incidents · ${pendingApprovals().length} pending approvals`,attention.length?attention.map(a=>`<div class="attention-item"><div class="attention-symbol ${a.color}">${icon(a.icon)}</div><div class="attention-text"><button class="link-button" data-action="${a.action}" data-id="${a.id}"><strong>${e(a.title)}</strong></button><p>${e(a.sub)}</p></div>${icon('chevron')}</div>`).join(''):empty('You’re up to date','No open incidents or pending approvals.','check'),btn(icon('arrow'),'goto-incidents','quiet sm','aria-label="View incidents"'))}</div><div class="cols">${tracesPanel(ts,'Recent decisions',6)}${panel('Runtime controls','Current policy and provider configuration',`<div class="health-row"><div><strong>Enterprise baseline</strong><p class="small muted">Policy v${state.policy.version} · ${e(state.policy.mode)}</p></div>${badge(state.policy.mode==='enforce'?'Enforcing':'Monitor only',state.policy.mode==='enforce'?'green':'amber')}</div><div class="health-row"><div><strong>Residency rule</strong><p class="small muted">${e(state.policy.region)}</p></div>${icon('globe')}</div><div class="health-row"><div><strong>Native connectors</strong><p class="small muted">${state.providers.filter(p=>p.status==='Healthy').length} ready in this demo</p></div>${badge('Configured','blue')}</div><div class="health-row"><div><strong>Tool permissions</strong><p class="small muted">Read, approval and deny boundaries</p></div>${icon('lock')}</div><div class="gap"><div class="row between small muted" style="font-size:10px;margin-bottom:8px"><span>Workspace budget used</span><strong>${Math.round(usagePercent(spent('org'),byId(state.budgets,'org').limit))}%</strong></div><div class="progress"><span style="width:${Math.min(100,usagePercent(spent('org'),byId(state.budgets,'org').limit))}%"></span></div><div class="row between gap">${btn('View policy','goto-policy','quiet sm')}${btn('View budgets','goto-budgets','quiet sm')}</div></div>`)}</div>`;}
function assetsList(){return [...state.projects.map(x=>({...x,type:'Application',icon:'code',risk:'Low'})),...state.agents.map(x=>({...x,type:'Agent',icon:'bot',risk:x.status==='Suspended'?'High':'Medium'})),...state.providers.map(x=>({...x,type:'Provider',icon:'server',owner:'Platform team',risk:x.region==='Global'?'Medium':'Low'})),...state.tools.map(x=>({...x,type:'MCP tool',icon:'key',owner:'Security team'}))];}
function inventory(){const all=assetsList(),q=ui.query.toLowerCase(),rows=all.filter(a=>(ui.filter==='All'||a.type===ui.filter)&&(a.name+' '+a.owner+' '+a.type).toLowerCase().includes(q));return pageHead('AI inventory','Know what exists, who owns it, and how it is governed.',btn(icon('plus')+' Register agent','new-agent','primary',restricted('projects')))+`<div class="stats">${stat('Total assets',all.length,'One inventory across your AI estate','layers')}${stat('Applications',state.projects.length,'Routes, credentials and budget bindings','code')}${stat('Governed agents',state.agents.length,'Every agent has an owner and purpose','bot')}${stat('MCP tools',state.tools.length,'Action-level permissions','key')}</div>`+searchToolbar('Search assets, owners or types…',['All','Application','Agent','Provider','MCP tool'])+`<section class="panel">${table(['Asset','Type','Owner','Risk','Status',''],rows.map(a=>`<tr><td><div class="row"><span class="entity-symbol" style="width:30px;height:30px">${icon(a.icon)}</span><button class="link-button" data-action="asset" data-id="${e(a.id)}" data-type="${a.type}">${e(a.name)}</button></div></td><td>${a.type}</td><td>${e(a.owner)}</td><td>${badge(a.risk,a.risk==='Low'?'green':a.risk==='Critical'?'red':'amber')}</td><td>${badge(a.status)}</td><td>${btn(icon('chevron'),'asset','quiet sm',`data-id="${e(a.id)}" data-type="${a.type}" aria-label="Inspect asset"`)}</td></tr>`),`${rows.length} matching assets`)}</section>`;}
function workforce(){return pageHead('Workforce AI','Activity controls for sanctioned and personal AI use.',btn(icon('shield')+' Review controls','workforce-help'))+notice('Workforce events are sample observations','Change an activity policy to see its new state and audit entry.')+`<div class="stats">${stat('Observed AI services',state.workforce.length,'Sample browser and desktop activity','globe')}${stat('Personal / unknown',state.workforce.filter(x=>x.instance!=='Enterprise tenant').length,'Services requiring review','eye')}${stat('Activity events',state.workforce.reduce((n,x)=>n+x.events,0),'Sample observed interactions','activity')}${stat('Blocking policies',state.workforce.filter(x=>x.action==='Block').length,'Applied to the activities below','shield')}</div><section class="panel"><div class="panel-head"><div><h2>AI application activity</h2><p class="panel-sub">Control activities within each application instance</p></div></div>${table(['Application / instance','Observed activity','Data classification','Policy',''],state.workforce.map(w=>`<tr><td><strong>${e(w.app)}</strong><div class="small muted">${e(w.instance)}</div></td><td>${w.activity}<div class="small muted">${w.events} events · ${e(w.user)}</div></td><td>${w.classification}</td><td>${badge(w.action,w.action==='Block'?'red':w.action==='Coach'?'amber':'green')}</td><td>${btn('Edit control','edit-workforce','sm',`data-id="${w.id}" ${restricted('policy')}`)}</td></tr>`))}</section>`;}
function gateway(){let body=pageHead('AI gateway','One governed entry point for applications and approved models.',btn(icon('plus')+' Add provider','new-provider','',restricted('providers'))+btn(icon('play')+' Playground','open-playground','primary'))+tabBar('gateway',['Overview','Providers & models','Routes','Applications & keys','Traces','Playground']);switch(ui.tabs.gateway){case'Providers & models':return body+providerCards();case'Routes':return body+routesView();case'Applications & keys':return body+projectsView();case'Traces':return body+tracesView();case'Playground':return body+playground('model');default:const ts=state.traces.filter(t=>t.kind==='model');return body+`<div class="stats">${stat('Model requests',ts.length,'All sample model interactions','activity')}${stat('Native connectors',state.providers.length,'Provider-owned credentials stay upstream','server')}${stat('Active applications',state.projects.filter(p=>p.status==='Active').length,'Scoped virtual access','key')}${stat('Model usage',amount(ts.reduce((n,t)=>n+t.tokens,0)),'Input and output tokens in sample ledger','wallet')}</div><div class="cols equal">${panel('Your first governed application','A connected path from access to evidence',`<div class="flow"><div class="flow-node"><span class="step-number">1</span><div><strong>Connect an approved provider</strong><p>Choose a native connector and residency.</p></div></div><div class="flow-node"><span class="step-number">2</span><div><strong>Bind access, route and budget</strong><p>Issue a sample virtual credential for your application.</p></div></div><div class="flow-node"><span class="step-number">3</span><div><strong>Run and inspect a request</strong><p>Trace policy, redaction, cost and provider selection.</p></div></div></div><div class="row gap">${btn('Create application','new-project','primary',restricted('projects'))}${btn('Test a call','open-playground')}</div>`)}${panel('Provider connectivity','Configured sample deployments',state.providers.map(p=>`<div class="health-row"><div class="row"><span class="entity-symbol" style="width:31px;height:31px">${e(p.symbol)}</span><div><strong>${e(p.name)}</strong><p class="small muted">${e(p.region)} · ${e(p.model)}</p></div></div>${badge(p.status)}</div>`).join(''))}</div>`+tracesPanel(ts,'Model-call decisions',7);}}
function providerCards(){return notice('Native provider connections','The wizard validates a sample configuration. It does not contact a provider or require real credentials.')+`<div class="cards">${state.providers.map(p=>`<article class="entity-card"><div class="row between"><span class="entity-symbol">${e(p.symbol)}</span>${badge('Demo ready','green')}</div><div><h2>${e(p.name)}</h2><p>${e(p.type)} connector</p></div><dl><div><dt>Deployment</dt><dd>${e(p.region)}</dd></div><div><dt>Model alias</dt><dd>${e(p.model)}</dd></div></dl><div class="chips"><span class="chip">Chat</span><span class="chip">Streaming</span><span class="chip">Tool calling</span></div><div class="bottom"><span class="small muted">Sample capabilities</span>${btn('Inspect','asset','sm',`data-id="${p.id}" data-type="Provider"`)}</div></article>`).join('')}</div>`;}
function routeFlow(r){return `<div class="flow"><div class="flow-node"><span class="step-number">1</span><div><strong>Identity & application access</strong><p>Valid virtual credential · active application</p></div>${icon('key')}</div><div class="flow-arrow">↓</div><div class="flow-node"><span class="step-number">2</span><div><strong>Policy & residency gate</strong><p>${e(state.policy.name)} v${state.policy.version} · ${e(state.policy.region)} · applies to every route</p></div>${icon('shield')}</div><div class="flow-arrow">↓</div><div class="flow-node"><span class="step-number">3</span><div><strong>Budget preflight</strong><p>All parent limits checked · reserve before execution</p></div>${icon('wallet')}</div><div class="flow-arrow">↓</div><div class="flow-branches"><div class="flow-node"><div><strong>Primary</strong><p>${e(providerName(r.primary))}</p><p>${e(byId(state.providers,r.primary)?.model)}</p></div></div><div class="flow-node fallback"><div><strong>Eligible fallback</strong><p>${e(providerName(r.fallback))}</p><p>Below ${r.threshold}% remaining, or primary ineligible</p></div></div></div><div class="flow-arrow">↓</div><div class="flow-node"><span class="step-number">4</span><div><strong>Response check & usage ledger</strong><p>No eligible, affordable model → deny before execution</p></div>${icon('file')}</div></div>`;}
function routesView(){return `<div class="toolbar"><span class="small muted">${state.routes.length} versioned route${state.routes.length!==1?'s':''} · all fallbacks inherit policy</span>${btn(icon('plus')+' Create route','new-route','primary',restricted('routes'))}</div><div class="cards two">${state.routes.map(r=>panel(e(r.name),`${e(r.alias)} · published v${r.version}`,routeFlow(r),btn('Edit','edit-route','sm',`data-id="${r.id}" ${restricted('routes')}`))).join('')}</div>`;}
function projectsView(){return `<div class="toolbar"><span class="small muted">Scoped access with route, policy and budget bindings</span>${btn(icon('plus')+' Create application','new-project','primary',restricted('projects'))}</div>`+notice('Demo credentials only','Generated keys are illustrative and cannot authenticate to any provider.')+`<section class="panel">${table(['Application','Owner','Route','Budget available','Access',''],state.projects.map(p=>`<tr><td><button class="link-button" data-action="project" data-id="${p.id}">${e(p.name)}</button><div class="small mono muted">${e(p.key.slice(0,14))}••••••</div></td><td>${e(p.owner)}</td><td>${e(byId(state.routes,p.route)?.name||'Unbound')}</td><td class="num nowrap">${money(budgetRemaining(p.budget))}</td><td>${badge(p.status)}</td><td>${btn('Manage','project','sm',`data-id="${p.id}"`)}</td></tr>`))}</section>`;}
function tracesView(kind){const q=ui.query.toLowerCase(),ts=state.traces.filter(t=>(!kind||t.kind===kind)&&(ui.filter==='All'||t.decision===ui.filter)&&(t.id+' '+projectName(t.project)+' '+t.target+' '+t.reason).toLowerCase().includes(q));return searchToolbar('Search traces, applications or targets…',['All','ALLOW','REDACT','DENY','REQUIRE_APPROVAL','ROUTE_ALTERNATE','MONITOR'])+`<section class="panel">${table(['Trace / time','Application / target','Decision','Cost','Tokens',''],traceRows(ts.slice(0,100)),`<span>Showing ${Math.min(100,ts.length)} of ${ts.length} matching traces</span><span>Versioned policy evidence</span>`)}</section>`;}
function playground(kind){const model=kind==='model',last=model?ui.lastModel:ui.lastTool;return notice('Interactive runtime simulation','Sample requests use deterministic demo checks. No provider or tool is actually called.')+`<div class="cols equal"><section class="panel"><div class="panel-head"><div><h2>${model?'Model request':'MCP tool call'}</h2><p class="panel-sub">${model?'Try a safe request, sensitive content or a blocked input':'Read, request approval, or test a denied action'}</p></div>${badge('Local simulation','blue')}</div><div class="panel-body"><form id="${model?'model-form':'tool-form'}" data-form="${model?'model-run':'tool-run'}"><div class="stack">${model?field('Application','sim-project',select('sim-project',state.projects.map(p=>[p.id,p.name]),ui.simProject,'data-change="sim-project"')):field('Agent identity','sim-agent',select('sim-agent',state.agents.map(a=>[a.id,a.name+' · '+a.status]),ui.simAgent,'data-change="sim-agent"'))}${model?field('Request','sim-prompt',`<textarea id="sim-prompt" name="sim-prompt" data-input="sim-prompt" rows="5" maxlength="8000" required>${e(ui.prompt)}</textarea>`):field('Tool','sim-tool',select('sim-tool',state.tools.map(t=>[t.id,t.name+' · '+t.action]),ui.simTool,'data-change="sim-tool"'))}${model?`<div class="row wrap">${btn('Safe request','preset-safe','sm')}${btn('Sensitive data','preset-pii','sm')}${btn('Prompt injection','preset-injection','sm')}</div>`:field('Arguments (JSON)','sim-args',`<textarea id="sim-args" name="sim-args" rows="5" class="mono" data-input="sim-args" maxlength="8000" required>${e(ui.args)}</textarea>`)}${model?field('Maximum output tokens','sim-tokens',input('sim-tokens',ui.maxTokens,'number','min="1" max="100000" required data-change="sim-tokens"'),'Illustrative reservation: ₹0.90 per 1,000 tokens on primary; ₹0.35 on fallback.'):notice('Approval does not execute a tool','Approve the exact request as Security admin, then return here and run it. Approvals are single-use.','amber')}<div class="row between"><span class="small muted">Policy v${state.policy.version} · ${e(state.policy.region)}</span><button type="submit" class="button primary" ${restricted('run')}>${icon('play')} ${model?'Run request':'Run tool call'}</button></div>${!can('run')?'<p class="small muted">Switch role preview to Platform admin, Security admin or Developer to run.</p>':''}</div></form></div></section><section class="panel"><div class="panel-head"><div><h2>Decision & execution</h2><p class="panel-sub">A complete view of the governed request</p></div></div><div class="panel-body" id="simulation-result" aria-live="polite">${last?resultView(last):empty('Ready when you are','Run a sample request to follow identity, policy, budget and execution.','route')}</div></section></div>`;}
function resultView(t){const stopped=t.decision==='DENY',wait=t.decision==='REQUIRE_APPROVAL';return `<div class="result-status"><div class="result-mark ${stopped?'red':wait?'amber':''}">${icon(stopped?'stop':wait?'clock':'check')}</div><div>${badge(t.decision)}<p class="small muted" style="margin-top:5px">${e(t.reason)}</p></div></div><div class="row between small" style="margin-bottom:21px"><span>${t.executed?'Simulated execution completed':'Execution stopped before provider / tool'}</span><strong class="num">${money(t.cost)}</strong></div>${t.stages.map(s=>`<div class="result-stage"><span class="stage-check ${s.status==='stop'?'stop':s.status==='wait'?'wait':''}">${s.status==='stop'?'×':s.status==='wait'?'…':'✓'}</span><div><strong>${e(s.name)}</strong><p>${e(s.detail)}</p></div></div>`).join('')}${t.executed?(stopped?notice('Response withheld','The response guardrail blocked the simulated output. Provider usage remains in the ledger.','red'):`<div class="code">${e(t.output||'Demo response: the governed request completed successfully.')}</div>`):''}<div class="row wrap gap">${btn('Inspect trace '+icon('arrow'),'trace','',`data-id="${t.id}"`)}${t.approvalId?btn('Review approval','approval','primary',`data-id="${t.approvalId}"`):''}${t.kind==='tool'?btn('Start new workflow','new-workflow','',restricted('run')):''}</div>`;}
function guardrails(){let body=pageHead('Guardrails','Inspect requests and responses with explainable policy controls.',badge('Policy v'+state.policy.version,'blue'))+tabBar('guardrails',['Overview','Policy builder','Simulator']);if(ui.tabs.guardrails==='Policy builder')return body+policyBuilder();if(ui.tabs.guardrails==='Simulator')return body+guardSimulator();const ts=state.traces;return body+`<div class="stats">${stat('Policy version','v'+state.policy.version,'Enterprise baseline currently active','shield')}${stat('Redacted requests',ts.filter(t=>t.decision==='REDACT').length,'Sensitive content transformed before execution','eye')}${stat('Blocked requests',ts.filter(t=>t.decision==='DENY').length,'Across identity, policy and budget controls','stop')}${stat('Response inspection',state.policy.response?'On':'Off',state.policy.streaming.replaceAll('_',' '),'check')}</div><div class="cols equal">${panel('Enterprise baseline','One policy shared by model and tool calls',`<div class="health-row"><strong>Enforcement</strong>${badge(state.policy.mode==='enforce'?'Enforce':'Monitor',state.policy.mode==='enforce'?'green':'amber')}</div><div class="health-row"><strong>Sensitive identifiers</strong>${badge(state.policy.pii,'blue')}</div><div class="health-row"><strong>Prompt injection</strong>${badge(state.policy.injection,state.policy.injection==='block'?'green':'amber')}</div><div class="health-row"><strong>Provider residency</strong><span class="small">${e(state.policy.region)}</span></div><div class="health-row"><strong>Maximum output</strong><span class="small num">${state.policy.maxTokens} tokens</span></div><div class="row gap">${btn('Edit policy','goto-policy','primary',restricted('policy'))}${btn('Open simulator','goto-guard-sim')}</div>`)}${panel('Test before publishing','Preview deterministic demo detections',`<div class="flow"><div class="flow-node"><span class="step-number">1</span><div><strong>Create a draft</strong><p>Change actions, residency and output controls.</p></div></div><div class="flow-node"><span class="step-number">2</span><div><strong>Simulate sample inputs</strong><p>Compare the draft with the active policy.</p></div></div><div class="flow-node"><span class="step-number">3</span><div><strong>Publish a new version</strong><p>Subsequent requests use the new configuration.</p></div></div></div>${state.policyDraft?`<div class="gap">${badge('Saved draft available','amber')}</div>`:''}`)}</div>`;}
function policyBuilder(){const p=state.policyDraft||state.policy;return `${!can('policy')?notice('Policy editing requires Security admin','Use the role preview selector to explore this workflow.','amber'):''}<div class="cols equal"><section class="panel"><div class="panel-head"><div><h2>Enterprise baseline</h2><p class="panel-sub">${state.policyDraft?'Saved draft · active policy remains v'+state.policy.version:'Editing a new draft from v'+state.policy.version}</p></div>${badge('Draft','amber')}</div><div class="panel-body"><form data-form="policy-save" id="policy-form"><fieldset style="border:0;padding:0;margin:0" ${can('policy')?'':'disabled'}><div class="form-grid">${field('Enforcement mode','policy-mode',select('policy-mode',[['enforce','Enforce'],['monitor','Monitor only']],p.mode))}${field('Sensitive identifiers','policy-pii',select('policy-pii',[['redact','Redact before execution'],['block','Block request'],['monitor','Record signal only']],p.pii))}${field('Prompt injection','policy-injection',select('policy-injection',[['block','Block request'],['monitor','Record signal only']],p.injection))}${field('Residency','policy-region',select('policy-region',['India only','Any region'],p.region))}${field('Maximum output tokens','policy-tokens',input('policy-tokens',p.maxTokens,'number','min="1" max="32768" required'))}${field('Streaming response mode','policy-stream',select('policy-stream',[['strict_buffered','Inspect before return'],['balanced_chunked','Inspect chunks'],['posthoc_monitor','Monitor after return']],p.streaming))}</div><label class="toggle-row"><span>Response inspection<p>Apply sensitive-data checks to the sample response.</p></span><input type="checkbox" name="policy-response" ${p.response?'checked':''}></label><div class="row gap wrap"><button type="submit" class="button">Save draft</button>${btn('Publish saved draft','publish-policy','primary',state.policyDraft?'':'disabled')}${state.policyHistory.length?btn('View versions','policy-history'):''}</div></fieldset></form></div></section>${panel('Publication controls','Draft changes do not affect requests until published',notice('Versioned and explainable','Every demo trace retains the policy version that governed it.')+`<div class="health-row"><strong>Active version</strong>${badge('v'+state.policy.version,'green')}</div><div class="health-row"><strong>Draft status</strong><span class="small">${state.policyDraft?'Saved, ready to simulate':'Not saved'}</span></div><div class="health-row"><strong>Available previous versions</strong><span>${state.policyHistory.length}</span></div><div class="row gap">${btn('Test in simulator','goto-guard-sim','primary')}${btn('View audit','goto-audit')}</div><p class="small muted gap">This prototype records publication and rollback locally. Deployment rollout and signatures require backend integration.</p>`)}</div>`;}
function guardSimulator(){return notice('Sample detector behavior','The local simulator recognizes a few example identifiers and injection phrases. It is not a production security detector.')+`<div class="cols equal">${panel('Policy simulator','Compare a saved draft with the active policy',`<form data-form="guard-sim" id="guard-sim-form"><div class="stack">${field('Policy version','guard-version',select('guard-version',[['active','Active v'+state.policy.version],...(state.policyDraft?[['draft','Saved draft']]:[])],'active'))}${field('Test input','guard-input',`<textarea id="guard-input" name="guard-input" rows="6" required maxlength="8000">My PAN is ABCDE1234F. Please summarise the approved claim.</textarea>`)}<button class="button primary" type="submit">${icon('play')} Inspect sample</button></div></form>`)}${panel('Inspection result','Signals and transformed input',`<div aria-live="polite">${ui.guardResult?`<div class="result-status"><div class="result-mark ${ui.guardResult.decision==='DENY'?'red':''}">${icon('shield')}</div><div>${badge(ui.guardResult.decision)}<p class="small muted">${e(ui.guardResult.reason)}</p></div></div><div class="chips">${ui.guardResult.signals.map(x=>`<span class="chip">${e(x)}</span>`).join('')||'<span class="small muted">No configured demo patterns matched.</span>'}</div><div class="code">${e(ui.guardResult.text)}</div><p class="small muted">${e(ui.guardResult.label)} · No runtime trace or charge created</p>`:empty('Inspect an example','See what the policy would allow, redact or block.','shield')}</div>`)}</div>`;}
function agents(){let body=pageHead('Agents & MCP','Give each agent a purpose, a budget and the right to do only what it needs.',btn(icon('plus')+' Register agent','new-agent','',restricted('projects'))+btn(icon('play')+' Test tool call','open-tool','primary'))+tabBar('agents',['Agents','MCP catalog','Tool playground','Tool traces']);if(ui.tabs.agents==='Tool playground')return body+playground('tool');if(ui.tabs.agents==='Tool traces')return body+tracesView('tool');if(ui.tabs.agents==='MCP catalog')return body+`<div class="stats">${stat('MCP servers',new Set(state.tools.map(t=>t.server)).size,'Approved sample server catalog','server')}${stat('Available tools',state.tools.length,'Tools classified by action','key')}${stat('Requires approval',state.tools.filter(t=>t.status==='Approval required').length,'Per-request approval for high-risk writes','clock')}${stat('Blocked tools',state.tools.filter(t=>t.status==='Blocked').length,'Never execute through the demo gateway','stop')}</div><section class="panel">${table(['Tool / server','Action','Allowed resource','Access',''],state.tools.map(t=>`<tr><td><button class="link-button mono" data-action="tool" data-id="${t.id}">${e(t.name)}</button><div class="small muted">${e(t.server)}</div></td><td>${badge(t.action,t.action==='READ'?'green':t.action==='DELETE'?'red':'amber')}</td><td class="mono small">${e(t.scope)}</td><td>${badge(t.status,t.status==='Approval required'?'amber':undefined)}</td><td>${btn('Inspect','tool','sm',`data-id="${t.id}"`)}</td></tr>`))}</section>`;return body+`<div class="cards">${state.agents.map(a=>`<article class="entity-card"><div class="row between"><span class="entity-symbol">${icon('bot')}</span>${badge(a.status)}</div><div><h2>${e(a.name)}</h2><p style="margin-top:6px">${e(a.purpose)}</p></div><dl><div><dt>Owner</dt><dd>${e(a.owner)}</dd></div><div><dt>Application</dt><dd>${e(projectName(a.project))}</dd></div><div><dt>Workflow cap</dt><dd>${a.maxSteps} steps</dd></div><div><dt>Available budget</d function budgetRows(){return state.budgets.map(b=>{const used=spent(b.id),pct=b.limit>0?used/b.limit*100:used>0?100:0;return `<div class="budget-row ${b.parent?'child':''}"><div class="budget-name"><button class="link-button" style="color:var(--ink)" data-action="edit-budget" data-id="${b.id}">${e(b.name)}</button><p class="small muted" style="font-size:10px">${b.parent?'Parent: '+e(byId(state.budgets,b.parent)?.name):'Workspace ceiling'} · ${b.hard?'Hard limit':'Soft alert'}</p></div><div class="budget-metric"><div class="amount"><span class="num">${money(used)} <span class="muted">of ${money(b.limit)}</span></span><strong>${Math.round(pct)}%</strong></div><div class="progress ${pct>=100?'red':pct>=80?'amber':''}"><span style="width:${Math.max(0,Math.min(100,pct))}%"></span></div></div><div class="budget-edit">${btn('Edit','edit-budget','sm',`data-id="${b.id}" ${restricted('budgets')}`)}</div></div>`}).join('');}
function budgets(){let body=pageHead('FinOps','Keep AI usage attributable, affordable and within policy.',btn(icon('download')+' Export usage','export-usage')+btn(icon('plus')+' Add budget','new-budget','primary',restricted('budgets')))+tabBar('budgets',['Overview','Budget hierarchy','Usage ledger']);if(ui.tabs.budgets==='Usage ledger')return body+tracesView();const used=spent('org'),limit=byId(state.budgets,'org').limit;body+=`<div class="stats">${stat('Total spend',money(used),'Derived from completed demo interactions','wallet')}${stat('Remaining',money(Math.max(0,limit-used)),'Workspace hard limit '+money(limit),'shield')}${stat('Budget scopes',state.budgets.length,'Every applicable parent is checked','layers')}${stat('Budget denials',state.traces.filter(t=>t.reason.includes('budget')).length,'Requests stopped before execution','stop')}</div><section class="panel"><div class="panel-head"><div><h2>Budget hierarchy</h2><p class="panel-sub">Shared demo period · INR · changes govern subsequent requests</p></div>${badge('Runtime enforcement','green')}</div>${budgetRows()}</section>`;if(ui.tabs.budgets==='Overview')body+=`<div class="cols equal gap">${panel('Spend by application','Cost attribution from the same runtime ledger',state.projects.map(p=>{const v=state.traces.filter(t=>t.project===p.id).reduce((n,t)=>n+t.cost,0);return `<div class="health-row"><div><strong>${e(p.name)}</strong><p class="small muted">${e(p.owner)}</p></div><strong class="num">${money(v)}</strong></div>`}).join(''))}${panel('What happens at the limit','Budget checks precede every simulated execution',`<div class="flow"><div class="flow-node"><span class="step-number">1</span><div><strong>Reserve before execution</strong><p>Estimate the model call and check every parent scope.</p></div></div><div class="flow-node"><span class="step-number">2</span><div><strong>Choose an eligible fallback</strong><p>A cheaper model must still satisfy residency and policy.</p></div></div><div class="flow-node"><s y and authorization need backend enforcement.')+`<section class="panel">${table(['Capability',...roles],Object.entries(permissions).map(([cap,rs])=>`<tr><td><strong>${({run:'Run demo calls',providers:'Manage providers',projects:'Manage applications',routes:'Publish routes',policy:'Publish policy',approval:'Approve tool calls',budgets:'Manage budgets',contain:'Contain agents',settings:'Workspace settings',assurance:'Run regression'})[cap]}</strong></td>${roles.map(r=>`<td>${rs.includes(r)?badge('Allowed','green'):'<span class="muted">Read only</span>'}</td>`).join('')}</tr>`))}</section>`;return body+`<div class="cols equal">${panel('Workspace configuration','Demonstration settings and evidence preference',`<form data-form="settings"><div class="stack">${field('Workspace','workspace-name',input('workspace-name','Acme Financial','text','disabled'))}${field('Evidence content','retention-mode',select('retention-mode',['Metadata only','Redacted content'],state.settings.retention,restricted('settings')))}${field('Retention period (days)','retention-days',input('retention-days',state.settings.days,'number',`min="1" max="3650" required ${restricted('settings')}`))}<span class="field-help">Retention preference is saved for the prototype; no backend retention job runs.</span><button type="submit" class="button primary" ${restricted('settings')}>Save settings</button></div></form>`)}${panel('About this prototype','A working HTML wireframe for the supplied UI design',`<div class="health-row"><strong>Data</strong><span class="small">Synthetic, held in this browser</span></div><div class="health-row"><strong>AI / MCP network access</strong><span class="small">None</span></div><div class="health-row"><strong>Role checks</strong><span class="small">Interface simulation</span></div><div class="health-row"><strong>Supported journeys</strong><span class="small">Model and tool governance</span></div><div class="row gap wrap">${btn('Open walkthrough','guide','primary')}${btn('Download current demo state','export-state')}</div>`)}</div>`;}

function mask(text){return String(text).replace(/\b[A-Z]{5}\d{4}[A-Z]\b/g,'[PAN REDACTED]').replace(/\b\d{12,19}\b/g,'[ACCOUNT REDACTED]').replace(/\bsk[_-](?:demo[_-])?[A-Za-z0-9_-]{6,}\b/g,'[SECRET REDACTED]').replace(/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/gi,'[EMAIL REDACTED]');}
function inspectText(raw,p=state.policy){const signals=[];const injection=/ignore (?:all )?(?:previous|prior|system) instructions|reveal (?:the )?system prompt|bypass (?:all )?(?:safety|policy)|exfiltrate/i.test(raw);const sensitive=mask(raw)!==raw;if(injection)signals.push('Prompt injection · demo pattern');if(sensitive)signals.push('Sensitive identifier · demo pattern');if(p.mode==='monitor')return {signals,text:raw,decision:signals.length?'MONITOR':'ALLOW',reason:signals.length?'Signals recorded in monitor-only mode':'No demo patterns matched'};if(injection&&p.injection==='block')return {signals,text:mask(raw),decision:'DENY',reason:'Prompt injection blocked by the active policy'};if(sensitive&&p.pii==='block')return {signals,text:mask(raw),decision:'DENY',reason:'Sensitive identifiers blocked by the active policy'};if(sensitive&&p.pii==='redact')return {signals,text:mask(raw),decision:'REDACT',reason:'Sensitive identifiers redacted before execution'};return {signals,text:raw,decision:signals.length?'MONITOR':'ALLOW',reason:signals.length?'Configured signals recorded without blocking':'Identity, policy and payload checks passed'};}
function canonical(v){if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(canonical).join(',')+']';return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}';}

function budgetCheck(project,cost){const chain=budgetChain(project.budget);if(!chain.length)return {ok:false,reason:'No budget scope is bound to this application'};const failed=chain.find(b=>b.hard&&round(spent(b.id)+cost)>b.limit);if(failed)return {ok:false,reason:`${failed.name} budget cannot reserve ${money(cost)}; ${money(Math.max(0,failed.limit-spent(failed.id)))} available`};const soft=chain.find(b=>!b.hard&&round(spent(b.id)+cost)>b.limit);return {ok:true,reason:soft?'Soft budget threshold crossed for '+soft.name:'All applicable budget scopes passed',soft:!!soft};}

tems=[{name:'Claims MCP package',status:'Approved',detail:'Sample signed package with read and delete capabilities. Runtime policy blocks delete.',tool:'claims.read'},{name:'Finance MCP package',status:'Review required',detail:'Sample package exposes financial write capability. An exact approval is required per request.',tool:'vendor.updateBankAccount'},{name:'Private inference model',status:'Approved',detail:'Illustrative approved model artifact. No artifact scan has been run.',tool:null}],s=items[idx];return modal(e(s.name),'Sample provenance record',badge(s.status,s.status==='Approved'?'green':'amber')+`<p class="gap small">${e(s.detail)}</p><dl class="info-grid gap"><div><dt>Record type</dt><dd>Illustrative artifact</dd></div><div><dt>Source</dt><dd>Demo internal registry</dd></div><div><dt>Scanner connected</dt><dd>No</dd></div><div><dt>Owner</dt><dd>Platform team</dd></div></dl>${s.tool?actions('Inspect tool boundary','tool',`data-id="${s.tool}"`):actions('Done','close-modal')}`);}case'export-trace':return download('neuralfence-trace-'+id+'.json',{prototype:true,trace:byId(state.traces,id)});case'export-usage':return download('neuralfence-demo-usage.json',{prototype:true,currency:'INR',usage:state.traces.map(({id,ts,project,kind,target,decision,cost,tokens})=>({id,ts,project,kind,target,decision,cost,tokens}))});case'export-incidents':return download('neuralfence-demo-findings.json',{prototype:true,incidents:state.incidents});case'export-audit':return download('neuralfence-demo-audit.json',{prototype:true,events:state.audit});case'export-state':return download('neuralfence-demo-state.json',{prototype:true,...state});case'reset-confirm':return modal('Reset the demo?','Clear changes made in this browser and restore the original sample data.',`<p class="small">Created applications, policies, approvals, traces and audit changes in this prototype will be cleared. You can export them first.</p><div class="dialog-actions">${btn('Export state','export-state')}${btn('Cancel','close-modal')}${btn('Reset demo','reset-demo','danger')}</div>`);case'reset-demo':state=seed();ui.lastModel=null;ui.lastTool=null;ui.guardResult=null;ui.simProject='claims';ui.simAgent='finance-agent';ui.simTool='vendor.updateBankAccount';ui.args=JSON.stringify(toolExample(ui.simTool),null,2);ui.prompt='Summarise the approved claims handling guidelines.';ui.maxTokens=1200;save();go('overview');toast('Original sample data restored.');return;case'new-workflow':{if(!requireCap('run'))return;const ag=byId(state.agents,ui.simAgent);const old=ag.workflow;ag.workflow=uid('wf');ag.stepsUsed=0;state.approvals.filter(x=>x.workflow===old&&['Pending','Approved'].includes(x.status)).forEach(x=>x.status='Cancelled');audit('Started new demo workflow',ag.name);ui.lastTool=null;save();render();toast('New workflow for '+ag.name+'.');return;}}});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();searchDialog();}if(event.key==='Escape'){closeModal();document.body.classList.remove('nav-open');}if(event.key==='Tab'&&document.querySelector('.dialog')){const nodes=[...document.querySelectorAll('.dialog button:not([disabled]),.dialog input:not([disabled]),.dialog select:not([disabled]),.dialog textarea:not([disabled]),.dialog a[href]')].filter(x=>x.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
