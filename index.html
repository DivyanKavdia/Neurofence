      :root {
        --ink: #172c2b;
        --muted: #637672;
        --line: #dfe7e3;
        --canvas: #f3f6f3;
        --paper: #fff;
        --nav: #102827;
        --nav-muted: #97b1a8;
        --blue: #087f6b;
        --blue-light: #e5f4ed;
        --green: #087450;
        --red: #bd4151;
        --amber: #9c631d;
        --purple: #795ba6;
        --mint: #c1f28a;
        --radius: 18px;
        --shadow: 0 16px 50px #142f2810;
        font-family:
          Manrope,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink);
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:disabled {
        opacity: 0.43;
        cursor: not-allowed;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #4bba8c;
        outline-offset: 3px;
      }
      a {
        color: var(--blue);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 30px;
        line-height: 1.25;
        letter-spacing: -1.2px;
        font-weight: 800;
      }
      h2 {
        font-size: 16px;
        letter-spacing: -0.45px;
        font-weight: 800;
      }
      h3 {
        font-size: 14px;
        font-weight: 750;
      }
      svg.icon {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .mono,
      code,
      pre {
        font-family: "SFMono-Regular", Consolas, monospace;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      a.sr-only:focus {
        z-index: 300;
        clip: auto;
        width: auto;
        height: auto;
        padding: 12px 20px;
        background: white;
      }
      [hidden] {
        display: none !important;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 19px;
      }
      .gap {
        margin-top: 22px;
      }
      .full {
        width: 100%;
      }
      .right {
        text-align: right;
      }
      .nowrap {
        white-space: nowrap;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 260px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 42px;
        padding: 10px 15px;
        border: 1px solid #dbe5df;
        border-radius: 10px;
        background: white;
        font-size: 12px;
        font-weight: 750;
        white-space: nowrap;
        text-decoration: none;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.15s;
      }
      .button:hover {
        background: #eff5ef;
        border-color: #b7cdc0;
      }
      .button:active {
        transform: translateY(1px);
      }
      .button.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
        box-shadow: 0 3px 7px #087f6b18;
      }
      .button.primary:hover {
        background: #096652;
      }
      .button.danger {
        color: var(--red);
        background: #fff3f4;
        border-color: #edcdd1;
      }
      .button.quiet {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
      }
      .button.quiet:hover {
        background: #eaf1eb;
      }
      .button.sm {
        padding: 6px 10px;
        min-height: 33px;
        font-size: 11px;
      }
      .icon-button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 10px;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
      }
      .icon-button:hover {
        background: #eaf1eb;
      }
      .link-button {
        border: 0;
        padding: 0;
        background: transparent;
        text-align: left;
        font-weight: 750;
        color: var(--blue);
        text-decoration: none;
      }
      .link-button:hover {
        text-decoration: underline;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 10px;
        font-weight: 800;
        line-height: 1.45;
        white-space: nowrap;
        background: #eef1ef;
        color: #586d65;
      }
      .badge.green {
        background: #e6f5e9;
        color: #207644;
      }
      .badge.red {
        background: #ffedef;
        color: #b13647;
      }
      .badge.amber {
        background: #fff2dd;
        color: #97631c;
      }
      .badge.blue {
        background: #e6f3f0;
        color: #177a65;
      }
      .badge.purple {
        background: #f0eafa;
        color: #73539f;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 100%;
        background: currentColor;
        display: inline-block;
      }
      .avatar {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #e7efe9;
        color: #416350;
        border: 1px solid #d9e7dc;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 800;
        flex-shrink: 0;
      }
      .logo-mark {
        width: 39px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--mint);
        flex-shrink: 0;
      }
      .logo-mark svg {
        width: 100%;
        height: 100%;
      }
      #sidebar {
        width: 248px;
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 50;
        background: var(--nav);
        color: #eef5e9;
        padding: 28px 18px 18px;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #335049 transparent;
      }
      .brand {
        padding: 0 8px 26px;
        gap: 10px;
      }
      .brand-name {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.9px;
      }
      .brand-sub {
        font-size: 9px;
        letter-spacing: 2.2px;
        color: #a3bcb1;
        text-transform: uppercase;
        margin-top: 1px;
      }
      .workspace-chip {
        margin: 0 4px 16px;
        padding: 12px 10px;
        border: 1px solid #91b1a322;
        background: #ffffff05;
        border-radius: 12px;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .workspace-chip .avatar {
        background: #395a46;
        color: #dfefd0;
        border: 0;
        border-radius: 9px;
      }
      .workspace-chip strong {
        font-size: 12px;
        font-weight: 750;
      }
      .workspace-chip span.small {
        color: #a0b7ac;
        font-size: 10px;
      }
      .nav-group-label {
        font-size: 9px;
        letter-spacing: 1.8px;
        font-weight: 700;
        color: #7f9d8f;
        margin: 21px 14px 8px;
        text-transform: uppercase;
      }
      .nav-button {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #b4c8bd;
        background: none;
        width: 100%;
        border: 0;
        text-align: left;
        padding: 12px 14px;
        border-radius: 10px;
        margin: 3px 0;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.6;
      }
      .nav-button .icon {
        width: 18px;
        height: 18px;
      }
      .nav-button:hover {
        background: #ffffff0a;
        color: white;
      }
      .nav-button.active {
        background: var(--mint);
        color: #20392c;
        font-weight: 800;
      }
      .nav-count {
        margin-left: auto;
        border-radius: 5px;
        font-size: 10px;

            ui.lastTool = null;
            save();
            render();
            toast("New workflow for " + ag.name + ".");
            return;
          }
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          (event.metaKey || event.ctrlKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();
          searchDialog();
          return;
        }
        if (event.key === "Escape") {
          if (document.querySelector(".dialog")) closeModal();
          else if (document.body.classList.contains("nav-open")) setNav(false);
          return;
        }
        const root =
          document.querySelector(".dialog") ||
          (document.body.classList.contains("nav-open")
            ? document.getElementById("sidebar")
            : null);
        if (event.key === "Tab" && root) {
          const nodes = [
            ...root.querySelectorAll(
              "button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]",
            ),
          ].filter((x) => x.getClientRects().length);
          const first = nodes[0],
            last = nodes[nodes.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last?.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first?.focus();
          }
        }
      });
      matchMedia("(max-width:760px)").addEventListener("change", () => {
        document.body.classList.remove("nav-open");
        syncOverlay();
      });
      function restoreRoute() {
        const [page, slug] = location.hash.slice(1).split("/");
        if (!page) return go("overview", undefined, true);
        if (!navs.flatMap((n) => n[1]).some((n) => n[0] === page))
          return go("overview", undefined, true);
        const tabs = {
          gateway: [
            "Overview",
            "Providers & models",
            "Routes",
            "Applications & keys",
            "Traces",
            "Playground",
          ],
          guardrails: ["Overview", "Policy builder", "Simulator"],
          agents: ["Agents", "MCP catalog", "Tool playground", "Tool traces"],
          budgets: ["Overview", "Budget hierarchy", "Usage ledger"],
          governance: ["Approvals", "Audit trail", "Settings", "Roles"],
          assurance: ["Red team", "Supply chain"],
        };
        const tab = tabs[page]?.find(
          (t) =>
            t
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/-$/, "") === slug,
        );
        go(page, tab || tabs[page]?.[0], true);
      }
      window.addEventListener("hashchange", restoreRoute);
      ui.args = JSON.stringify(toolExample(ui.simTool), null, 2);
      if (location.hash) restoreRoute();
      else render();
    </script>
  </body>
</html>
